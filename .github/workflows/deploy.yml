name: Deploy Multi-Cloud RAG Platform

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_cloud:
        description: 'Target Cloud Deployment'
        required: true
        default: 'both'
        type: choice
        options:
          - azure
          - aws
          - both

permissions:
  id-token: write   # Required for Azure & AWS OIDC authentication
  contents: read

jobs:
  # Azure's image. A push or a "both" run includes Azure only while the repository variable AZURE_ENABLED is "true"
  # (the Azure deployment was retired in October 2026); choosing "azure" always runs it. deploy-azure and its gate
  # need this job, so they're skipped with it.
  build-and-push:
    name: Build & Push Image
    if: ${{ github.event.inputs.target_cloud == 'azure' || (vars.AZURE_ENABLED == 'true' && (github.event_name == 'push' || github.event.inputs.target_cloud == 'both')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Build & Push Image to ACR
        run: |
          IMAGE_URI="${{ vars.ACR_NAME }}.azurecr.io/rag-api:${{ github.sha }}"
          IMAGE_LATEST="${{ vars.ACR_NAME }}.azurecr.io/rag-api:latest"
          docker build -t $IMAGE_URI -t $IMAGE_LATEST .
          docker push $IMAGE_URI
          docker push $IMAGE_LATEST

  deploy-azure:
    name: Deploy to Azure Container Apps
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Registry & Update Container App
        run: |
          CORS="${{ vars.CORS_ALLOW_ORIGINS }}"
          if [ -z "$CORS" ] || [[ "$CORS" == *,* ]]; then
            echo "::error::GitHub variable CORS_ALLOW_ORIGINS must list the web frontend's origins separated by spaces (e.g. https://<project>.vercel.app http://localhost:3000)"
            exit 1
          fi
          IDENTITY_ID=$(az identity list --resource-group ${{ vars.RESOURCE_GROUP }} --query "[0].id" -o tsv)
          CLIENT_ID=$(az identity list --resource-group ${{ vars.RESOURCE_GROUP }} --query "[0].clientId" -o tsv)
          
          az containerapp registry set \
            --name ${{ vars.CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --server "${{ vars.ACR_NAME }}.azurecr.io" \
            --identity "$IDENTITY_ID"
            
          az containerapp update \
            --name ${{ vars.CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --image "${{ vars.ACR_NAME }}.azurecr.io/rag-api:${{ github.sha }}" \
            --set-env-vars "AZURE_CLIENT_ID=$CLIENT_ID" "SECRET_BACKEND=azure_keyvault" "MCP_DNS_REBINDING_PROTECTION=false" \
              "CORS_ALLOW_ORIGINS=$CORS" "APP_REVISION=${{ github.sha }}"

  post-deploy-azure-gate:
    name: Live Evaluation Gate (Azure)
    needs: deploy-azure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # live-eval stores its run as an eval_run event in the state store, where the dashboard reads it
      - name: Point live-eval at the state store
        run: |
          # Lookup first, as a command of its own, so a failed az call fails the step
          ACCOUNT_URL=$(az storage account list -g ${{ vars.RESOURCE_GROUP }} --query '[0].primaryEndpoints.blob' -o tsv)
          {
            echo "STATE_BACKEND=azure_blob"
            echo "AZURE_STORAGE_ACCOUNT_URL=$ACCOUNT_URL"
          } >> "$GITHUB_ENV"

      # The pushed revision itself: until it's ready, the old revision keeps answering /health. Then its routing
      # self-test must have passed, or every /query would answer 500.
      - name: Wait for Azure Container App Warmup
        run: |
          echo "Polling ${{ vars.DEPLOYED_APP_URL }}/health for revision ${{ github.sha }}..."
          for _ in {1..30}; do
            HEALTH=$(curl -s "${{ vars.DEPLOYED_APP_URL }}/health" || true)
            if [ "$(echo "$HEALTH" | jq -r .revision 2>/dev/null)" = "${{ github.sha }}" ]; then
              if [ "$(echo "$HEALTH" | jq -r .routing_ok)" = "false" ]; then
                echo "::error::The new revision's routing self-test failed (/health: routing_ok=false), so /query would answer 500; the app's startup logs say why"
                exit 1
              fi
              echo "Azure Container App is ready: $HEALTH"
              exit 0
            fi
            sleep 10
          done
          echo "::error::/health never reported revision ${{ github.sha }}"
          exit 1

      - name: Run Live Evaluation Gate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SECRET_BACKEND: env
        run: |
          python -m src.app live-eval \
            --target-url ${{ vars.DEPLOYED_APP_URL }} \
            --revision ${{ github.sha }}

  deploy-aws:
    name: Deploy to AWS Lambda Container
    # No needs: AWS builds its own image below, so an Azure failure never blocks it
    if: ${{ github.event_name == 'push' || github.event.inputs.target_cloud == 'aws' || github.event.inputs.target_cloud == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Image to ECR
        run: |
          ECR_URI="${{ vars.AWS_ECR_REPO }}:${{ github.sha }}"
          ECR_LATEST="${{ vars.AWS_ECR_REPO }}:latest"
          docker build -t $ECR_URI -t $ECR_LATEST .
          docker push $ECR_URI
          docker push $ECR_LATEST

      - name: Deploy / Update AWS Lambda Container
        env:
          # One definition for both the update and the create branch below
          LAMBDA_ENV: "Variables={SECRET_BACKEND=aws_secretsmanager,LOG_TO_FILE=false,LOG_TO_CONSOLE=true,HOME=/tmp,HF_HUB_OFFLINE=1,TRANSFORMERS_OFFLINE=1,AWS_LWA_ASYNC_INIT=true,MCP_DNS_REBINDING_PROTECTION=false,STATE_BACKEND=s3,S3_STATE_BUCKET=${{ vars.AWS_STATE_BUCKET }},LOCAL_DIR=/tmp/state/.local,DATA_DIR=/tmp/state/data,CORS_ALLOW_ORIGINS=${{ vars.CORS_ALLOW_ORIGINS }},APP_REVISION=${{ github.sha }}}"
        run: |
          FUNCTION_NAME="ragprod-api"
          IMAGE_URI="${{ vars.AWS_ECR_REPO }}:${{ github.sha }}"

          if [ -z "${{ vars.AWS_STATE_BUCKET }}" ]; then
            echo "::error::GitHub variable AWS_STATE_BUCKET is not set (infra/aws/setup.ps1 prints it)"
            exit 1
          fi
          CORS="${{ vars.CORS_ALLOW_ORIGINS }}"
          if [ -z "$CORS" ] || [[ "$CORS" == *,* ]]; then
            echo "::error::GitHub variable CORS_ALLOW_ORIGINS must list the web frontend's origins separated by spaces (e.g. https://<project>.vercel.app http://localhost:3000)"
            exit 1
          fi

          if aws lambda get-function --function-name $FUNCTION_NAME --region ${{ vars.AWS_REGION }} 2>/dev/null; then
            echo "Updating existing AWS Lambda function code..."
            aws lambda update-function-code \
              --function-name $FUNCTION_NAME \
              --image-uri $IMAGE_URI \
              --region ${{ vars.AWS_REGION }}

            echo "Waiting for Lambda code update to complete..."
            aws lambda wait function-updated \
              --function-name $FUNCTION_NAME \
              --region ${{ vars.AWS_REGION }}

            echo "Updating Lambda environment configuration..."
            aws lambda update-function-configuration \
              --function-name $FUNCTION_NAME \
              --region ${{ vars.AWS_REGION }} \
              --timeout 300 \
              --memory-size 3008 \
              --environment "$LAMBDA_ENV"

            echo "Waiting for Lambda configuration update to complete..."
            aws lambda wait function-updated \
              --function-name $FUNCTION_NAME \
              --region ${{ vars.AWS_REGION }}
          else
            echo "Creating new AWS Lambda container function..."
            aws lambda create-function \
              --function-name $FUNCTION_NAME \
              --package-type Image \
              --code ImageUri=$IMAGE_URI \
              --role ${{ vars.AWS_LAMBDA_ROLE_ARN }} \
              --environment "$LAMBDA_ENV" \
              --timeout 300 \
              --memory-size 3008 \
              --region ${{ vars.AWS_REGION }}

            aws lambda create-function-url-config \
              --function-name $FUNCTION_NAME \
              --auth-type NONE \
              --region ${{ vars.AWS_REGION }}

            aws lambda add-permission \
              --function-name $FUNCTION_NAME \
              --statement-id FunctionURLAllowPublicAccess \
              --action lambda:InvokeFunctionUrl \
              --principal "*" \
              --function-url-auth-type NONE \
              --region ${{ vars.AWS_REGION }}

            aws lambda add-permission \
              --function-name $FUNCTION_NAME \
              --statement-id FunctionURLAllowInvokeAction \
              --action lambda:InvokeFunction \
              --principal "*" \
              --invoked-via-function-url \
              --region ${{ vars.AWS_REGION }}
          fi

          echo "Waiting for Lambda function update to complete..."
          aws lambda wait function-updated --function-name $FUNCTION_NAME --region ${{ vars.AWS_REGION }}

  post-deploy-aws-gate:
    name: Live Evaluation Gate (AWS)
    needs: deploy-aws
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get AWS Lambda Function URL
        run: |
          FUNCTION_NAME="ragprod-api"
          URL_CONFIG=$(aws lambda get-function-url-config --function-name $FUNCTION_NAME --region ${{ vars.AWS_REGION }} --query "FunctionUrl" --output text)
          CLEAN_URL=$(echo "$URL_CONFIG" | sed 's/\/$//')
          echo "DEPLOYED_AWS_URL=$CLEAN_URL" >> "$GITHUB_ENV"

      # The pushed revision itself, and its routing self-test must have passed, or every /query would answer 500
      - name: Wait for AWS Lambda Warmup
        run: |
          echo "Polling $DEPLOYED_AWS_URL/health for revision ${{ github.sha }}..."
          for _ in {1..30}; do
            HEALTH=$(curl -s "$DEPLOYED_AWS_URL/health" || true)
            if [ "$(echo "$HEALTH" | jq -r .revision 2>/dev/null)" = "${{ github.sha }}" ]; then
              if [ "$(echo "$HEALTH" | jq -r .routing_ok)" = "false" ]; then
                echo "::error::The new version's routing self-test failed (/health: routing_ok=false), so /query would answer 500; the Lambda logs say why"
                exit 1
              fi
              echo "AWS Lambda API is ready: $HEALTH"
              exit 0
            fi
            sleep 10
          done
          echo "::error::/health never reported revision ${{ github.sha }}"
          exit 1

      - name: Run Live Evaluation Gate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SECRET_BACKEND: env
          STATE_BACKEND: s3  # live-eval stores its run as an eval_run event in the state bucket, for the dashboard
          S3_STATE_BUCKET: ${{ vars.AWS_STATE_BUCKET }}
        run: |
          python -m src.app live-eval \
            --target-url "$DEPLOYED_AWS_URL" \
            --revision ${{ github.sha }}
